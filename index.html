<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kid Tick — My Routine</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- Timer overlay -->
<div class="timer-overlay" id="timer-overlay"></div>

<!-- Modal overlay (edit profile, etc.) -->
<div class="modal-overlay" id="modal-overlay"></div>

<div class="app">

  <!-- ════════ WELCOME VIEW ════════ -->
  <div class="view" id="view-welcome">
    <header class="header">
      <h1>Kid Tick</h1>
    </header>
    <div class="view-content"></div>
  </div>

  <!-- ════════ ROUTINE VIEW ════════ -->
  <div class="view" id="view-routine">
    <header class="header">
      <h1>Kid Tick</h1>
      <p class="greeting" id="greeting"></p>
    </header>

    <!-- Profile switcher -->
    <div class="profile-switcher" id="profile-switcher"></div>

    <!-- Streak -->
    <div class="streak-banner hidden" id="streak-banner"></div>

    <!-- Daily tip -->
    <div class="daily-tip" id="daily-tip"></div>

    <!-- Progress Ring -->
    <div class="progress-area">
      <div class="progress-ring-wrap">
        <svg class="progress-ring" viewBox="0 0 130 130">
          <defs>
            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6C63FF"/>
              <stop offset="100%" stop-color="#FF6B9D"/>
            </linearGradient>
          </defs>
          <circle class="progress-ring__bg" cx="65" cy="65" r="54"/>
          <circle class="progress-ring__fill" cx="65" cy="65" r="54"
                  stroke-dasharray="339.29" stroke-dashoffset="339.29"/>
        </svg>
        <div class="progress-center">
          <span class="progress-stars" id="progress-stars"></span>
          <span class="progress-label" id="progress-count"></span>
        </div>
      </div>
      <p class="progress-text" id="progress-text"></p>
    </div>

    <!-- Celebration -->
    <div class="celebration" id="celebration">
      <div class="big-emoji">🎉🌟🎉</div>
      <div class="msg">Amazing! All done!</div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="morning">🌅 Morning</button>
      <button class="tab-btn" data-tab="afternoon">☀️ Afternoon</button>
      <button class="tab-btn" data-tab="evening">🌙 Evening</button>
    </div>

    <!-- Routine Sections -->
    <div class="routine-section active" id="section-morning"></div>
    <div class="routine-section" id="section-afternoon"></div>
    <div class="routine-section" id="section-evening"></div>

    <!-- Reset -->
    <div class="reset-wrap">
      <button class="reset-btn" id="reset-btn">Start Fresh 🔄</button>
    </div>
  </div>

  <!-- ════════ STICKERS VIEW ════════ -->
  <div class="view" id="view-stickers">
    <div class="view-content"></div>
  </div>

  <!-- ════════ WEEKLY VIEW ════════ -->
  <div class="view" id="view-weekly">
    <div class="view-content"></div>
  </div>

  <!-- ════════ SETTINGS VIEW ════════ -->
  <div class="view" id="view-settings">
    <div class="view-content"></div>
  </div>

</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <button class="nav-btn active" data-view="routine">
    <span class="nav-icon">🏠</span>
    <span class="nav-text">Home</span>
  </button>
  <button class="nav-btn" data-view="stickers">
    <span class="nav-icon">⭐</span>
    <span class="nav-text">Stickers</span>
  </button>
  <button class="nav-btn" data-view="weekly">
    <span class="nav-icon">📅</span>
    <span class="nav-text">Week</span>
  </button>
  <button class="nav-btn" data-view="settings">
    <span class="nav-icon">⚙️</span>
    <span class="nav-text">Settings</span>
  </button>
</nav>

<!-- Scripts (order matters: data → i18n → store → effects → render → app) -->
<script src="js/routines.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/effects.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>

</body>
</html>
